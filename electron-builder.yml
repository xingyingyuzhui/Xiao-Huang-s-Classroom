# 路线 A：Electron 安装包（尽量压体积）
# - app.asar 只放 main + package.json
# - 运行时 server 来自 .electron-stage（scripts/stage-electron-server.js 预精简）
# - maximum 压缩 + 仅中/英 Chromium 语言包

appId: com.xiaohuang.classroom
productName: 小黄的教室
copyright: Copyright © 小黄的教室
artifactName: XiaoHuang-Classroom-${version}-${os}-${arch}.${ext}

directories:
  output: dist-electron
  buildResources: apps/desktop/resources

files:
  - apps/desktop/main.cjs
  - apps/desktop/package.json
  - package.json

extraResources:
  - from: .electron-stage/server
    to: server

asar: true
compression: maximum

electronLanguages:
  - zh-CN
  - en-US

npmRebuild: false

icon: icons/icon.png

win:
  icon: icons/icon.ico
  target:
  - target: nsis
    arch:
      - x64
  - target: portable
    arch:
      - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 小黄的化学实验室
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"
  artifactName: XiaoHuang-ChemLab-Setup-${version}.${ext}

portable:
  artifactName: XiaoHuang-ChemLab-Portable-${version}.${ext}

mac:
  icon: icons/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.education

dmg:
  title: 小黄的化学实验室

linux:
  target:
    - AppImage
  category: Education
