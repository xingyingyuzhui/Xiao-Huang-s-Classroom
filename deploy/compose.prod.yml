# Production override — never a standalone stack.
# Requires CLOUD_IMAGE_TAG / LAB_IMAGE_TAG (git SHA). Do not deploy floating tags.
#
#   GIT_SHA=<sha> CLOUD_IMAGE_TAG=<sha> LAB_IMAGE_TAG=<sha> \
#     docker compose --env-file /opt/xiaohuang-classroom/secrets/.env \
#       -f deploy/compose.yml -f deploy/compose.prod.yml up -d
#
# Web is not a container: publish /opt/xiaohuang-classroom/releases/<sha>/web
# and atomically retarget releases/current/web (see deploy/scripts/deploy.sh).
#
# HTTPS GATE: this override still binds HTTP loopback only. Real passwords,
# API keys, rosters, WeChat, avatars, and auto-update need a domain + TLS.

services:
  postgres:
    # Keep major pin (postgres:16-alpine). No host port in prod.
    ports: []
    # Override any accidental publish from a local experiment file.
    expose:
      - '5432'

  cloud-server:
    image: xiaohuang-cloud-server:${CLOUD_IMAGE_TAG:?set CLOUD_IMAGE_TAG}
    env_file:
      - path: ${ENV_FILE:-/opt/xiaohuang-classroom/secrets/.env}
        required: false

  lab-server:
    image: xiaohuang-lab-server:${LAB_IMAGE_TAG:?set LAB_IMAGE_TAG}
