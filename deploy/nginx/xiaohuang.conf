# Public edge for 小黄的教室.
#
# HTTPS GATE: IP+HTTP (listen 80 / server_name _) is test-only.
# Real passwords, API keys, class rosters, WeChat login, avatars, and
# auto-update feeds require a registered domain and TLS. Do not treat
# this vhost as a production login surface until 443 + certificates exist.
#
# Public data plane: cloud-server only. Lab Express (:3001) is Electron/loopback.
# Do not re-open location /api/ as a proxy to lab.

server {
    listen 80 default_server;
    server_name _;

    root /opt/xiaohuang-classroom/releases/current/web;
    index index.html;

    location /api/cloud/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    location /livez {
        proxy_pass http://127.0.0.1:3000;
    }

    # Readiness includes schema version; loopback only — do not leak to public.
    location /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    # Unmatched public /api/* (settings, students, ai, mastery, labs, …) must not
    # reach the lab server. Prefer 404 for unauthenticated public callers.
    location /api/ {
        default_type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found"}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
