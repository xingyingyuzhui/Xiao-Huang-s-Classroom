# Local/staging compose skeleton — Task 3 foundation (Agent H extends in Task 8).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: xiaohuang_cloud
    volumes:
      - cloud_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloud -d xiaohuang_cloud']
      interval: 5s
      timeout: 5s
      retries: 10

  cloud-server:
    build:
      context: ..
      dockerfile: apps/cloud-server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cloud:${POSTGRES_PASSWORD}@postgres:5432/xiaohuang_cloud
      CLOUD_TOKEN_SIGNING_KEY: ${CLOUD_TOKEN_SIGNING_KEY:?set CLOUD_TOKEN_SIGNING_KEY}
      CLOUD_AI_KEK: ${CLOUD_AI_KEK:?set CLOUD_AI_KEK}
      CLOUD_PUBLIC_ORIGIN: ${CLOUD_PUBLIC_ORIGIN:?set CLOUD_PUBLIC_ORIGIN}
      CLOUD_REGISTRATION_MODE: closed
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cloud_pg_data:
