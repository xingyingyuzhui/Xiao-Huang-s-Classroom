name: Container Build
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose authority
        env:
          GIT_SHA: ${{ github.sha }}
          CLOUD_IMAGE_TAG: ${{ github.sha }}
          LAB_IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ci-placeholder
          CLOUD_TOKEN_SIGNING_KEY: ci-placeholder-token-signing-key-32
          CLOUD_AI_KEK: ci-placeholder-ai-kek-32-characters
          CLOUD_PUBLIC_ORIGIN: https://example.invalid
        run: |
          docker compose -f deploy/compose.yml config >/dev/null
          docker compose -f deploy/compose.yml -f deploy/compose.prod.yml config >/dev/null
      - name: Build immutable SHA images
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          APP_VERSION: 0.0.1
        run: |
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_TIME="${BUILD_TIME:-unknown}" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg SOURCE_REPO="https://github.com/${{ github.repository }}" \
            -t "xiaohuang-cloud-server:${GIT_SHA}" \
            -f apps/cloud-server/Dockerfile .
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_TIME="${BUILD_TIME:-unknown}" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg SOURCE_REPO="https://github.com/${{ github.repository }}" \
            -t "xiaohuang-lab-server:${GIT_SHA}" \
            -f apps/server/Dockerfile .
      - name: Ephemeral postgres for compose.test.yml
        run: |
          docker compose -f deploy/compose.test.yml up -d
          docker compose -f deploy/compose.test.yml down
