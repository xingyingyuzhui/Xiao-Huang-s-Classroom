name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality run 1（干净环境）
        run: npm run quality

      - name: Quality run 2（coverage/build 产物生成后可重复性）
        run: npm run quality
