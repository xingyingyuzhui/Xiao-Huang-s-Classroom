name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality run 1（干净环境）
        run: npm run quality

      - name: Quality run 2（coverage/build 产物生成后可重复性）
        run: npm run quality

      - name: Server start health smoke（干净 start 合同）
        run: node scripts/verify-server-start.mjs --mode=start

      - name: Server dev health smoke（watcher 首轮构建 + 监听 + 整树回收）
        run: node scripts/verify-server-start.mjs --mode=dev

  node-version-portability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Un-cached workspace tests（Node ${{ matrix.node }}，防 Turbo 假绿）
        run: TURBO_FORCE=true npm test
