name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run quality
      - name: Check version tags
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "Version mismatch: package=$PKG_VERSION tag=$TAG_VERSION"; exit 1; }

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable image
        run: docker build -t xiaohuang-cloud:${{ github.ref_name }} -f apps/cloud-server/Dockerfile .
      - name: Generate SBOM
        run: echo "SBOM generation placeholder"

  electron-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Package Electron
        run: npx electron-builder --win --publish never
      - name: Generate checksums
        shell: bash
        run: sha256sum dist-electron/*.exe > dist-electron/SHA256SUMS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: dist-electron/
          retention-days: 30
