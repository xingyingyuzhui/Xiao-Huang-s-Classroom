name: Release Verify
# Manual release verification — does NOT SSH-deploy or stop cloud containers.
# Production deploy remains operator-driven via deploy/scripts/deploy.sh <sha>
# after this workflow (or local quality) is green.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full Git SHA to verify'
        required: true
      environment:
        description: 'Target environment label (informational)'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate SHA format
        run: |
          SHA='${{ github.event.inputs.sha }}'
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA must be a full 40-char hex commit: got '$SHA'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha }}
          fetch-depth: 0

      - name: Confirm SHA is in this repository
        run: |
          SHA='${{ github.event.inputs.sha }}'
          git cat-file -e "${SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality gate
        env:
          GIT_SHA: ${{ github.event.inputs.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          APP_VERSION: 0.0.1
        run: npm run quality

      - name: Build SHA-tagged images
        env:
          GIT_SHA: ${{ github.event.inputs.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          APP_VERSION: 0.0.1
        run: |
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_TIME="${BUILD_TIME:-unknown}" \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "xiaohuang-cloud-server:${GIT_SHA}" \
            -f apps/cloud-server/Dockerfile .
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_TIME="${BUILD_TIME:-unknown}" \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "xiaohuang-lab-server:${GIT_SHA}" \
            -f apps/server/Dockerfile .
          docker image inspect "xiaohuang-cloud-server:${GIT_SHA}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            | grep -Fx "$GIT_SHA"
          test -f apps/web/dist/version.json
          node -e "const v=require('./apps/web/dist/version.json'); if(v.gitSha!==process.env.GIT_SHA){console.error(v); process.exit(1)}"

      - name: Compose config (prod override, no latest)
        env:
          GIT_SHA: ${{ github.event.inputs.sha }}
          CLOUD_IMAGE_TAG: ${{ github.event.inputs.sha }}
          LAB_IMAGE_TAG: ${{ github.event.inputs.sha }}
          CLOUD_TOKEN_SIGNING_KEY: test-signing-key-32chars-minimum!!
          CLOUD_AI_KEK: test-ai-kek-32chars-minimum-value!!
          CLOUD_PUBLIC_ORIGIN: http://127.0.0.1:3000
          POSTGRES_PASSWORD: test-postgres-password
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.prod.yml config > /tmp/compose.resolved.yml
          ! grep -E 'image:.*:latest' /tmp/compose.resolved.yml
          grep -F "xiaohuang-cloud-server:${GIT_SHA}" /tmp/compose.resolved.yml
          bash -n deploy/scripts/deploy.sh
          bash -n deploy/scripts/rollback.sh
          bash -n deploy/scripts/backup-postgres.sh
          bash -n deploy/scripts/restore-postgres.sh

      - name: Manual deploy gate
        run: |
          echo "Verification passed for ${{ github.event.inputs.sha }}."
          echo "This workflow does not deploy. After approval, an operator must:"
          echo "  1) transfer SHA images + apps/web/dist as releases/<sha>/web"
          echo "  2) run deploy/scripts/deploy.sh <sha>"
          echo "  3) run deploy/scripts/verify-release.sh with EXPECTED_SHA=<sha>"
