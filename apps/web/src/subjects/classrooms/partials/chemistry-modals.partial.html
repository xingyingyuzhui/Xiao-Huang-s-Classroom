      <!-- AI 生成分子弹层 -->
      <div class="modal-backdrop" id="genMolBackdrop" aria-hidden="true"></div>
      <div
        class="modal-panel"
        id="genMolModal"
        role="dialog"
        aria-labelledby="genMolTitle"
        aria-hidden="true"
      >
        <div class="modal-head">
          <h2 id="genMolTitle">AI 生成分子</h2>
          <button type="button" class="settings-close" id="btnGenMolClose" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="modal-body">
          <p class="settings-hint">
            输入<strong>高中常见小分子</strong>的名称或化学式，将生成示意用 3D 球棍模型。
            原子数建议在 20 以内（如乙醇、苯、葡萄糖、乙酸）。
            <strong>紫杉醇、阿莫西林</strong>等复杂药物无法可靠生成完整 3D，请勿使用。
          </p>
          <label class="field">
            <span>描述</span>
            <textarea
              id="genMolPrompt"
              rows="4"
              placeholder="例如：乙酸、葡萄糖、臭氧、氨、苯……"
            ></textarea>
          </label>
          <p class="settings-status" id="genMolStatus" aria-live="polite"></p>
          <div class="settings-actions">
            <button type="button" class="btn primary" id="btnGenMolSubmit">生成并保存</button>
            <button type="button" class="btn ghost" id="btnGenMolCancel">取消</button>
          </div>
        </div>
      </div>

      <!-- AI 生成实验弹层 -->
      <div class="modal-backdrop" id="genLabBackdrop" aria-hidden="true"></div>
      <div
        class="modal-panel"
        id="genLabModal"
        role="dialog"
        aria-labelledby="genLabTitle"
        aria-hidden="true"
      >
        <div class="modal-head">
          <h2 id="genLabTitle">AI 生成实验</h2>
          <button type="button" class="settings-close" id="btnGenLabClose" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="modal-body">
          <p class="settings-hint">
            描述一个<strong>高中化学实验</strong>，将生成可编辑的脚本步骤与预习选择题草稿。
            生成后请在脚本页检查，再点「保存脚本」写入本地。
          </p>
          <label class="field">
            <span>实验描述</span>
            <textarea
              id="genLabPrompt"
              rows="4"
              placeholder="例如：高锰酸钾制氧气、实验室制二氧化碳、乙酸乙酯的制备……"
            ></textarea>
          </label>
          <p class="settings-status" id="genLabStatus" aria-live="polite"></p>
          <div class="settings-actions">
            <button type="button" class="btn primary" id="btnGenLabSubmit">生成草稿</button>
            <button type="button" class="btn ghost" id="btnGenLabCancel">取消</button>
          </div>
        </div>
      </div>

      <!-- AI 生成配平脚本弹层（对齐实验探究 genLab） -->
      <div class="modal-backdrop" id="genBalanceBackdrop" aria-hidden="true"></div>
      <div
        class="modal-panel"
        id="genBalanceModal"
        role="dialog"
        aria-labelledby="genBalanceTitle"
        aria-hidden="true"
      >
        <div class="modal-head">
          <h2 id="genBalanceTitle">AI 生成配平脚本</h2>
          <button type="button" class="settings-close" id="btnGenBalanceClose" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="modal-body">
          <p class="settings-hint">
            输入<strong>未配平</strong>的化学方程式，将生成可编辑的配平脚本草稿（起式、目标式与步骤）。
            生成后请在脚本页检查，再点「保存脚本」写入本地。
          </p>
          <label class="field lab-equation-field" id="genBalanceEqField">
            <span>未配平方程式</span>
            <textarea
              id="genBalancePrompt"
              rows="3"
              placeholder="例如：Fe + O2 = Fe2O3、C2H5OH + O2 = CO2 + H2O……"
            ></textarea>
          </label>
          <p class="settings-status" id="genBalanceStatus" aria-live="polite"></p>
          <div class="settings-actions">
            <button type="button" class="btn primary" id="btnGenBalanceSubmit">生成草稿</button>
            <button type="button" class="btn ghost" id="btnGenBalanceCancel">取消</button>
          </div>
        </div>
      </div>
